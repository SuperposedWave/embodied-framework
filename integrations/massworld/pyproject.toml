[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massworld-embodied"
version = "0.1.0"
description = "Whole-run MassWorld execution backend for EmbodiedEval public 0.3"
requires-python = ">=3.10"
dependencies = ["embodied-eval>=0.3,<0.4"]

[project.entry-points."worldevalkit.execution_backends"]
embodied-v03 = "massworld_embodied:EmbodiedBackend"

[tool.setuptools.packages.find]
where = ["src"]
