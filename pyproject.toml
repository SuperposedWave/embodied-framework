[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-eval"
version = "0.1.0"
description = "Typed adapter contracts for embodied simulation evaluation"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
real-client = ["numpy>=1.22,<3", "PyYAML>=6", "Pillow>=10", "websockets>=16,<17", "msgpack>=1", "google-crc32c>=1.6"]

[tool.setuptools.packages.find]
include = ["embodied_eval*"]

[tool.setuptools.package-data]
"embodied_eval.adapters" = ["*.json"]
"embodied_eval.mn" = ["asset_manifests/*.json"]
